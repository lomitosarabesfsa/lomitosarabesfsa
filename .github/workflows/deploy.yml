# ============================================================
#  Deploy automático a Cloudflare al push en main.
#  · Landing page → Cloudflare Pages (inmediato)
#  · API Worker   → Cloudflare Workers, solo si pasan los tests y
#    si el esquema de D1 está aplicado en producción.
# ============================================================

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Deploy landing page (Cloudflare Pages) ──
  pages:
    name: Deploy Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=lomitosarabesfsa

  # ── Tests + validación de la cadena de migraciones ──
  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - run: npm ci

      # Corre la cadena completa sobre una D1 local: si una migración tiene SQL
      # inválido o no converge desde cero, se cae acá y no en el deploy.
      - name: Migraciones sobre D1 local
        run: node scripts/migrar.mjs apply --local
        env:
          WRANGLER_SEND_METRICS: 'false'

      - name: Verificar esquema local
        run: node scripts/migrar.mjs check --local
        env:
          WRANGLER_SEND_METRICS: 'false'

      - name: Unit tests
        run: npx vitest run worker/test/index.test.js test/migraciones.test.js

  # ── Deploy API Worker (Cloudflare Workers) ──
  worker:
    name: Deploy Worker
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - run: npm ci

      # Gate: si falta una migración, si el registro no coincide con los
      # archivos o si la base real no tiene las tablas/columnas que el Worker
      # consulta, el deploy no sale.
      - name: Verificar esquema de D1 (producción)
        run: node scripts/migrar.mjs check --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'

      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: admin
          command: deploy
