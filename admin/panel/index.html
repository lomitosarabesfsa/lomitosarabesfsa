<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel — Lomitos Árabes FSA</title>
  <link rel="stylesheet" href="styles.css">

<body>

<!-- ================= LOGIN ================= -->
<div id="login" style="display:none">
  <h2>🔐 Panel Admin</h2>
  <p class="error-msg" id="login-error"></p>
  <div class="field"><label>Usuario</label><input type="text" id="login-user" autocomplete="username"></div>
  <div class="field"><label>Clave</label><input type="password" id="login-pass" autocomplete="current-password"></div>
  <button class="btn-primary" id="login-btn" data-action="do-login">Ingresar</button>
</div>

<!-- ================= APP ================= -->
<div id="app" style="display:none">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>🌯 Lomitos FSA</h1>
      <span class="user" id="user-label"></span>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav">
      <button class="active" data-tab="productos" data-action="show-tab" data-tab="productos"><span class="icon">🍔</span> Productos</button>
      <button data-tab="categorias" data-action="show-tab" data-tab="categorias"><span class="icon">🗂️</span> Categorías</button>
      <button data-tab="modifiers" data-action="show-tab" data-tab="modifiers"><span class="icon">➕</span> Modifiers</button>
      <button data-tab="promos" data-action="show-tab" data-tab="promos"><span class="icon">🔥</span> Promos</button>
      <button data-tab="horarios" data-action="show-tab" data-tab="horarios"><span class="icon">🕒</span> Horarios</button>
      <button data-tab="galeria" data-action="show-tab" data-tab="galeria"><span class="icon">📸</span> Galería</button>
      <button data-tab="config" data-action="show-tab" data-tab="config"><span class="icon">⚙️</span> Config</button>
    </nav>
    <div class="sidebar-footer"><button data-action="logout">Salir</button></div>
  </aside>

  <div class="main-content">
    <div class="tab active" id="tab-productos">
      <div class="toolbar">
        <h2>Productos</h2>
        <div style="display:flex;gap:10px;align-items:center">
          <input class="search-bar" type="text" placeholder="🔍 Buscar producto..." id="search-productos" oninput="renderProductos()">
          <button class="btn-primary" data-action="abrir-producto">+ Nuevo</button>
        </div>
      </div>
      <div id="err-productos"></div>
      <div id="lista-productos"></div>
    </div>

    <div class="tab" id="tab-categorias">
      <div class="toolbar"><h2>Categorías</h2><button class="btn-primary" data-action="abrir-categoria">+ Nueva</button></div>
      <div id="err-categorias"></div>
      <div id="lista-categorias"></div>
    </div>

    <div class="tab" id="tab-modifiers">
      <div class="toolbar"><h2>Modifier Groups</h2><button class="btn-primary" data-action="abrir-modifier-group">+ Nuevo grupo</button></div>
      <p style="color:var(--muted);font-size:.85rem;margin-bottom:16px">Grupos de opciones que el comensal elige al agregar un producto. Asociá cada grupo a un <strong>producto</strong> o a una <strong>categoría</strong>.</p>
      <div id="err-modifiers"></div>
      <div id="lista-modifiers"></div>
    </div>

    <div class="tab" id="tab-promos">
      <div class="toolbar"><h2>Promos (banner)</h2><button class="btn-primary" data-action="agregar-promo">+ Agregar</button></div>
      <div id="err-promos"></div>
      <div id="lista-promos"></div>
      <div style="margin-top:16px"><button class="btn-primary" id="btn-guardar-promos" data-action="guardar-promos">💾 Guardar promos</button></div>
    </div>

    <div class="tab" id="tab-horarios">
      <div class="toolbar"><h2>Horarios</h2><button class="btn-primary" id="btn-guardar-horarios" data-action="guardar-horarios">💾 Guardar horarios</button></div>
      <div id="lista-horarios"></div>
      <p style="color:var(--muted);font-size:.8rem;margin-top:12px">Dejá el horario vacío si ese día está cerrado.</p>
    </div>

    <div class="tab" id="tab-galeria">
      <div class="toolbar"><h2>Galería</h2><button class="btn-primary" data-action="upload-galeria">+ Subir foto</button></div>
      <input type="file" id="file-galeria" accept="image/*" multiple style="display:none" onchange="subirGaleria(this.files)">
      <div id="err-galeria"></div>
      <div id="lista-galeria"></div>
      <div style="margin-top:16px"><button class="btn-primary" id="btn-guardar-galeria" data-action="guardar-galeria">💾 Guardar galería</button></div>
    </div>

    <div class="tab" id="tab-config">
      <div class="toolbar"><h2>Configuración</h2></div>
      <div class="field"><label>Número de WhatsApp (sin +)</label><input type="text" id="config-whatsapp"></div>
      <button class="btn-primary" id="btn-guardar-config" data-action="guardar-config">💾 Guardar</button>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal-content"></div>
</div>
<div class="toast" id="toast"></div>


    <script src="app.js"></script>
</body>

</html>
