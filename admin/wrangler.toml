name = "lomitos-api"
main = "worker/src/index.js"
compatibility_date = "2025-01-01"

# ==== BASE DE DATOS (D1) ====
# Crear:  npx wrangler d1 create lomitos-db
# Luego pegar el database_id que aparece y volver a correr: npx wrangler deploy
[[d1_databases]]
binding = "DB"
database_name = "lomitos-db"
database_id = "f03410c3-0771-472b-bcc5-c0188468153c"

# ==== ALMACENAMIENTO (R2) ====
[[r2_buckets]]
binding = "IMAGENES"
bucket_name = "lomitosarabesfsar2"

# ==== VARIABLES ====
[vars]
R2_PUBLIC_URL = "https://pub-c8b21a7042f64b0387a78407a11c934f.r2.dev"

# ==== SECRETOS (configurar con: npx wrangler secret put NOMBRE) ====
# ADMIN_USER     → usuario del panel (default: admin)
# ADMIN_PASS     → clave del panel (¡elegí una segura!)
# AUTH_SECRET    → clave aleatoria para firmar los tokens de sesión

# ============================================================
# Nota: la web pública sigue alojada en Netlify y consumirá
# este Worker vía https://lomitos-api.<tu-subdominio>.workers.dev
# (habilitar CORS en el Worker, ya está configurado en el código)
# ============================================================
